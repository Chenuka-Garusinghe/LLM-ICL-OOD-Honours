# Synthetic arm (branch synthetic-experiments). Design: docs/generator_spec.pdf;
# phases and gates: docs/research_plan.md. Loaded by src/utils/config.py.

models:
  - name: "qwen2.5-7b-instruct"
    path: "Qwen/Qwen2.5-7B-Instruct"
    chat_template: true
  - name: "qwen2.5-7b-base"
    path: "Qwen/Qwen2.5-7B"
    chat_template: false
  - name: "llama-3.1-8b-instruct"
    path: "meta-llama/Llama-3.1-8B-Instruct"
    chat_template: true

inference:
  device: "auto"           # auto = CUDA, then Apple Metal (MPS), then CPU; or force cuda / mps / cpu
  dtype: "bfloat16"        # downgraded to float16 on pre-Ampere CUDA, float32 on CPU

selection:
  k_candidates: [8, 16, 32]  # P2 picks the smallest k that passes the learnability gate
  k: 8                     # P2 (28 Sep 2026): Qwen2.5-7B-Instruct passes the gate at 8 (results/v3/synthetic/p2/learnability_gate.json)
  n_demo_seeds: 3
  base_seed: 42

evaluation:
  n_eval_tasks: 24
  queries_per_class: 10      # 20 queries per task and environment
  environments: ["id", "covariate", "spurious_reversal"]
  # Probe splits added after P4 (hiccups/18), appended after the standard ones so
  # existing rows are unchanged: a variance shift, and f8-neutral copies of queries.
  probe_environments: ["covariate_scale"]
  f8_neutral_environments: ["id", "covariate", "covariate_scale"]

sata:
  d_model: 128
  n_heads: 4
  n_layers: 4
  max_demos: 256             # matches the evaluation pool
  max_features: 16
  lr: 1.0e-4                 # needs the decimal point, or safe_load parses a string
  epochs: 50
  batch_size: 64
  patience: 10
  device: "auto"             # P5 benchmarks this against "cpu" for SATA's tiny batches

generator:
  n_features: 10
  n_causal_range: [3, 3]
  rule_families: ["linear", "tree"]
  heldout_family: null
  n_heldout_family_tasks: 0
  n_train_tasks: 1000        # SATA training
  n_val_tasks: 100           # SATA validation
  n_test_tasks: 24           # evaluation tasks
  spurious_strength_range: [0.80, 0.90]
  label_noise: 0.02
  coefficient_scale: 1.5     # older sampler only (SATA training until P5); evaluation tasks use |c| ~ U(1, 2)
  task_seed: 42              # evaluation and pilot tasks: SeedSequence([task_seed, suite, index])
  demos_per_task: 256
  n_test_id: 100
  n_test_ood: 100
  queries_per_env: 32        # SATA training batches
  environments: ["id", "covariate", "spurious_reversal", "mechanism"]  # SATA training

# Per-task datasets written by scripts/make_synth_data.py (or NB01) to data/synthetic/v3/<suite>/.
suites:
  eval: 24                   # evaluation tasks: 12 linear then 12 tree, domains alternating
  pilot: 12                  # P2 pilot tasks, same distribution, disjoint task ids

paths:
  data_synthetic: "data/synthetic"
  results: "results/v3/synthetic"
  figures: "figures"
  models: "models"
