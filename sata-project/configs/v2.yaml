# v2 configuration — see REDESIGN_RATIONALE.md for why each change from
# default.yaml (the frozen v1 config) exists. Loaded by setting SATA_CONFIG=
# configs/v2.yaml (src/utils/config.py::load_config); default.yaml stays the
# implicit default so nothing that doesn't opt in changes behaviour.

# Models
base_llms:
  - name: "Llama-3.1-8B-Instruct"
    path: "meta-llama/Llama-3.1-8B-Instruct"  # or local path
  - name: "Qwen2.5-7B-Instruct"               # second model for robustness
    path: "Qwen/Qwen2.5-7B-Instruct"

# Serving
vllm:
  tensor_parallel: 1
  gpu_memory_utilisation: 0.90
  max_model_len: 8192
  quantization: null   # 8B/7B bf16 weights (~16GB) fit a single GPU with room to spare

# Larger models (branch: appollo-cluster-v, single H200, 141GB HBM). bf16
# weights alone for a 70B model are ~140GB -- that's the entire card with
# nothing left for KV cache/activations, so this must run quantised. FP8
# (dynamic, computed from the bf16 checkpoint at load time -- no separate
# quantised checkpoint needed) halves weights to ~70GB and is what H200's
# Hopper tensor cores execute natively, unlike AWQ/GPTQ's int4 dequant path.
base_llms_70b:
  - name: "Llama-3.1-70B-Instruct"
    path: "meta-llama/Llama-3.1-70B-Instruct"
  - name: "Qwen2.5-72B-Instruct"
    path: "Qwen/Qwen2.5-72B-Instruct"

# Single H200 SXM (vast.ai, Hopper, 141GB HBM3e). TP=1, not 2: 70B FP8 weights
# are ~70GB, so they fit one card -- at gpu_memory_utilisation 0.90 that is
# ~127GB usable, leaving ~57GB for KV cache, ample at max_model_len 8192. TP=2
# would fail outright on a single-GPU instance; the original TP=2 / "35GB each
# via NVLink" setting assumed the 2xH200 appollo-cluster layout, so keep that
# only when renting a 2-GPU box.
#
# H200 is Hopper (sm_90), not Blackwell (sm_100) -- this is the LOW-risk
# toolchain case. Hopper is supported by every current vllm/torch wheel and
# executes FP8 natively on its tensor cores, which is what makes fp8 the right
# quantisation here rather than an int4 AWQ/GPTQ dequant path. No special CUDA
# version hunting is needed; a standard recent CUDA 12.x image is fine.
#
# Still worth doing before launching any grid, because the instance is rented
# and ephemeral:
#   python -c "import torch; print(torch.cuda.get_device_capability())"   # (9, 0)
# then load one model and run a single batch. Freeze afterwards
# (pip freeze > requirements.lock.txt): requirements.txt is unpinned, and
# unpinned deps on a box that disappears means the run cannot be reproduced.
vllm_70b:
  tensor_parallel: 1
  gpu_memory_utilisation: 0.90
  max_model_len: 8192
  quantization: "fp8"

# Local MLX dev-loop backend (branch: local-testing-w-mlx-models). Mirrors
# the exact v1 base_llms above, in true bf16 (not quantised).
mlx:
  backend: "mlx"
  models:
    - name: "Llama-3.1-8B-Instruct"
      path: "mlx-community/Meta-Llama-3.1-8B-Instruct-bf16"
    - name: "Qwen2.5-7B-Instruct"
      path: "mlx-community/Qwen2.5-7B-Instruct-bf16"

# Prompting (Stage 1 fixes — REDESIGN_RATIONALE.md §5.1)
prompting:
  chat_template: true
  order_policy: "shuffle"
  calibration: true

# Demo selection
k_primary: 8
k_sensitivity: 16       # swept across all datasets in Notebooks 02 and 06
pool_size: 256           # real arm demo pool
seed_accuracy: [42, 123, 456, 789, 1024]    # 5 seeds for accuracy runs
seed_faithfulness: [42, 123, 456]            # 3 seeds for faithfulness

# Evaluation
test_rows_id: 500
test_rows_ood: 500
faithfulness_subset: 200

# SATA
sata:
  d_model: 128
  n_heads: 4
  n_layers: 4
  max_demos: 64
  max_features: 16      # pad/truncate to this
  lr: 1.0e-4  # PyYAML's safe_load parses bare "1e-4" as a string, not a float — needs the decimal point
  epochs: 50
  batch_size: 64
  patience: 10

# Generator (Stage 2 fixes — REDESIGN_RATIONALE.md §5.2)
generator:
  n_features: 10
  n_causal_range: [3, 5]
  n_train_tasks: 2000
  n_val_tasks: 200
  n_test_tasks: 200
  n_heldout_family_tasks: 50
  rule_families: ["linear", "threshold", "tree", "sparse_interaction"]
  heldout_family: "sparse_interaction"
  # v1 had [0.96, 0.995] -- a near-photocopy of the label (see
  # REDESIGN_RATIONALE.md §4.2 Fact B). 0.80-0.90 keeps the spurious feature
  # more reliable than the causal signal in training (still tempting) but
  # genuinely breakable, not a label column.
  spurious_strength_range: [0.80, 0.90]
  label_noise: 0.02
  coefficient_scale: 1.5
  demos_per_task: 64
  queries_per_env: 32
  environments: ["id", "covariate", "spurious_reversal", "extrapolation", "missing_feature", "mechanism"]

# Demo pool provenance (Stage 2f / Stage 4) -- id_pool is the new headline
# (deployment-realistic: demos from ID, queries from the shifted env);
# matched_pool is v1's behaviour, retained as a secondary condition.
pool_provenance: ["id_pool", "matched_pool"]

# Paths -- v2 outputs are fully separated from v1's so both can be reported
# side by side (v1 preserved via the `v1-results` git tag).
paths:
  data_real: "data/real"
  data_synthetic: "data/synthetic_v2"
  whyshift_raw_cache: "data/whyshift_raw_cache"
  results: "results/v2"
  figures: "figures/v2"
  tables: "tables/v2"
  models: "models/v2"

# Results schema -- see src/utils/results_schema.py::RESULTS_SCHEMA_V2
results_columns:
  - arm
  - dataset
  - environment
  - model
  - method
  - seed
  - query_id
  - prediction
  - label
  - logprob_0
  - logprob_1
  - demo_ids
  - k
  - pool_provenance
  - order_seed
  - logprob_0_cf
  - logprob_1_cf
  - prediction_raw
  - prompt_version
